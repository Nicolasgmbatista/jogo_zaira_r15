<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moto Pixel - Gatinhos</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0d0d;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  user-select: none;
}
canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  border: 4px solid #222;
  background: #1a1a2e;
  max-width: 100%;
  height: auto;
}
#ui {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  text-align: center;
  pointer-events: none;
  text-shadow: 2px 2px 0 #000;
  font-size: 16px;
  line-height: 1.4;
}
#hint {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  color: #888;
  font-size: 12px;
  text-shadow: 1px 1px 0 #000;
  pointer-events: none;
}
#menu {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 10;
}
#menu.open { display: flex; }
#menu h2 {
  color: #ff9ff3;
  font-size: 28px;
  margin-bottom: 16px;
  text-shadow: 2px 2px 0 #000;
}
#collection {
  display: grid;
  grid-template-columns: repeat(5, 72px);
  gap: 12px;
  max-width: 420px;
  margin-bottom: 20px;
}
.cat-slot {
  width: 72px;
  height: 72px;
  background: #2d3436;
  border: 3px solid #636e72;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  image-rendering: pixelated;
}
.cat-slot.got {
  border-color: #ff9ff3;
  background: #3d2a3d;
}
#menu p {
  color: #ccc;
  font-size: 14px;
  margin-bottom: 8px;
}
#closeBtn {
  margin-top: 12px;
  padding: 8px 24px;
  background: #6c5ce7;
  color: #fff;
  border: none;
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
  border: 2px solid #a29bfe;
}
#closeBtn:hover { background: #a29bfe; color: #000; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="ui">
  DISTÂNCIA: <span id="dist">0</span>m<br>
  GATINHOS: <span id="cats">0</span> / <span id="totalCats">0</span>
  &nbsp;|&nbsp; [M] Coleção
</div>
<div id="hint">A ←  D →  |  W = EMPINAR  |  Pegue os gatinhos  |  Rampas com BOOST voam sobre buracos</div>

<div id="menu">
  <h2>Coleção de Gatinhos</h2>
  <p id="menuCount">0 / 0 coletados</p>
  <div id="collection"></div>
  <button id="closeBtn">Fechar (M ou ESC)</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = canvas.width;
const H = canvas.height;

// ========== IMAGENS ==========
const imgPlayer = new Image();
imgPlayer.src = 'img/player.png';

// Gatinhos (opcional: img/cat1.png, cat2.png ...)
const catImgs = [];
for (let i = 1; i <= 12; i++) {
  const im = new Image();
  im.src = `img/cat${i}.png`;
  catImgs.push(im);
}

// ========== FÍSICA ==========
const GRAVITY = 0.48;
const MAX_SPEED = 9.5;
const ACCEL = 0.30;
const FRICTION = 0.935;
const WHEELIE_TORQUE = 0.085;
const WHEELIE_RETURN = 0.05;
const MAX_WHEELIE = 1.1;

// ========== PLAYER ==========
const player = {
  x: 160,
  y: 300,
  vx: 0,
  vy: 0,
  w: 90,
  h: 58,
  angle: 0,
  grounded: false,
  onRamp: false,
  wheelie: false,
  boostTimer: 0
};

let camX = 0;
let menuOpen = false;

// ========== NÍVEL ==========
const level = [];
const cats = []; // collectibles

function buildLevel() {
  level.length = 0;
  cats.length = 0;

  // Início
  level.push({ type: 'ground', x: 0, y: 420, w: 580, h: 130 });

  // Rampa + plataforma alta
  level.push({ type: 'rampUp', x: 580, y: 420, w: 160, h: 100 });
  level.push({ type: 'platform', x: 740, y: 320, w: 260, h: 28 });
  level.push({ type: 'rampDown', x: 1000, y: 320, w: 140, h: 100 });
  level.push({ type: 'ground', x: 580, y: 420, w: 700, h: 130 });

  // 1º BURACO + BOOST
  level.push({ type: 'rampUp', x: 1280, y: 420, w: 210, h: 135 });
  level.push({ type: 'boost',  x: 1390, y: 295, w: 95, h: 18 });
  level.push({ type: 'ground', x: 1720, y: 420, w: 480, h: 130 });
  level.push({ type: 'platform', x: 1520, y: 255, w: 160, h: 24 });

  // 2º BURACO
  level.push({ type: 'rampUp', x: 2200, y: 420, w: 240, h: 155 });
  level.push({ type: 'boost',  x: 2330, y: 275, w: 100, h: 18 });
  level.push({ type: 'ground', x: 2740, y: 420, w: 420, h: 130 });
  level.push({ type: 'platform', x: 2520, y: 295, w: 130, h: 22 });
  level.push({ type: 'platform', x: 2880, y: 340, w: 150, h: 22 });

  // 3º BURACO + caminho alto
  level.push({ type: 'rampUp', x: 3160, y: 420, w: 190, h: 125 });
  level.push({ type: 'boost',  x: 3260, y: 305, w: 85, h: 18 });
  level.push({ type: 'platform', x: 3480, y: 275, w: 220, h: 26 });
  level.push({ type: 'rampDown', x: 3700, y: 275, w: 160, h: 145 });
  level.push({ type: 'ground', x: 3860, y: 420, w: 580, h: 130 });

  // 4º BURACO
  level.push({ type: 'rampUp', x: 4440, y: 420, w: 260, h: 165 });
  level.push({ type: 'boost',  x: 4580, y: 265, w: 110, h: 20 });
  level.push({ type: 'ground', x: 5020, y: 420, w: 900, h: 130 });
  level.push({ type: 'platform', x: 4860, y: 295, w: 120, h: 22 });
  level.push({ type: 'platform', x: 5160, y: 245, w: 170, h: 24 });
  level.push({ type: 'platform', x: 5420, y: 315, w: 140, h: 22 });

  // === GATINHOS (tokens) ===
  const catPositions = [
    { x: 350,  y: 380 },
    { x: 820,  y: 280 },
    { x: 1100, y: 380 },
    { x: 1480, y: 220 },
    { x: 1900, y: 380 },
    { x: 2450, y: 240 },
    { x: 2650, y: 380 },
    { x: 3000, y: 300 },
    { x: 3550, y: 235 },
    { x: 4000, y: 380 },
    { x: 4700, y: 220 },
    { x: 5300, y: 205 }
  ];

  catPositions.forEach((p, i) => {
    cats.push({
      x: p.x,
      y: p.y,
      w: 36,
      h: 36,
      id: i,
      collected: false,
      bob: Math.random() * Math.PI * 2
    });
  });

  document.getElementById('totalCats').textContent = cats.length;
  buildCollectionUI();
}

function buildCollectionUI() {
  const box = document.getElementById('collection');
  box.innerHTML = '';
  cats.forEach((c, i) => {
    const slot = document.createElement('div');
    slot.className = 'cat-slot' + (c.collected ? ' got' : '');
    slot.id = 'slot' + i;
    slot.textContent = c.collected ? '🐱' : '?';
    box.appendChild(slot);
  });
  updateMenuCount();
}

function updateMenuCount() {
  const got = cats.filter(c => c.collected).length;
  document.getElementById('menuCount').textContent = `${got} / ${cats.length} coletados`;
  document.getElementById('cats').textContent = got;
}

buildLevel();

// ========== INPUT ==========
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();

  if (e.code === 'KeyM' || e.code === 'Escape') {
    toggleMenu();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

document.getElementById('closeBtn').onclick = () => toggleMenu(false);

function toggleMenu(force) {
  menuOpen = force !== undefined ? force : !menuOpen;
  document.getElementById('menu').classList.toggle('open', menuOpen);
}

// ========== HELPERS ==========
function getSegmentY(seg, px) {
  if (seg.type === 'ground' || seg.type === 'platform') return seg.y;
  if (seg.type === 'boost') return seg.y;
  if (seg.type === 'rampUp') {
    const t = Math.max(0, Math.min(1, (px - seg.x) / seg.w));
    return seg.y - t * seg.h;
  }
  if (seg.type === 'rampDown') {
    const t = Math.max(0, Math.min(1, (px - seg.x) / seg.w));
    return seg.y + t * seg.h;
  }
  return seg.y;
}

function getSegmentSlope(seg) {
  if (seg.type === 'rampUp') return -seg.h / seg.w;
  if (seg.type === 'rampDown') return seg.h / seg.w;
  return 0;
}

// ========== UPDATE ==========
function update() {
  if (menuOpen) return;

  // Movimento
  if (keys['KeyD'] || keys['ArrowRight']) player.vx += ACCEL;
  if (keys['KeyA'] || keys['ArrowLeft'])  player.vx -= ACCEL;

  player.vx = Math.max(-MAX_SPEED * 0.6, Math.min(MAX_SPEED, player.vx));
  if (player.grounded) player.vx *= FRICTION;
  else player.vx *= 0.997;

  // Wheelie para cima (ângulo negativo)
  if (keys['KeyW'] || keys['ArrowUp']) {
    if (player.grounded || player.onRamp) {
      player.angle -= WHEELIE_TORQUE;
      player.wheelie = true;
    }
  } else {
    player.wheelie = false;
    if (player.grounded || player.onRamp) {
      player.angle *= (1 - WHEELIE_RETURN * 2.2);
    } else {
      player.angle *= 0.97;
    }
  }
  player.angle = Math.max(-MAX_WHEELIE, Math.min(0.18, player.angle));

  // Boost (só velocidade horizontal extra, sem forçar vy negativa residual)
  if (player.boostTimer > 0) {
    player.boostTimer--;
    player.vx = Math.min(player.vx + 0.55, MAX_SPEED + 5);
  }

  // Gravidade
  player.vy += GRAVITY;
  if (player.vy > 16) player.vy = 16;

  // Movimento
  player.x += player.vx;
  player.y += player.vy;

  // ===== COLISÃO ROBUSTA =====
  player.grounded = false;
  player.onRamp = false;

  const feetX = player.x + player.w * 0.42;
  let feetY = player.y + player.h;

  // Ordena segmentos sob o player e pega o mais alto (topo)
  let bestY = null;
  let bestSeg = null;

  for (const seg of level) {
    if (feetX < seg.x - 8 || feetX > seg.x + seg.w + 8) continue;
    const surfaceY = getSegmentY(seg, feetX);

    // Só considera se o pé está perto ou acima da superfície
    if (feetY >= surfaceY - 14 && player.y + player.h * 0.4 < surfaceY + 30) {
      if (bestY === null || surfaceY < bestY) {
        bestY = surfaceY;
        bestSeg = seg;
      }
    }
  }

  if (bestSeg && bestY !== null) {
    // Se está caindo ou já está em cima
    if (player.vy >= -2 || feetY >= bestY - 6) {
      // Snap para o chão
      player.y = bestY - player.h;
      player.vy = 0;
      player.grounded = true;

      if (bestSeg.type === 'boost') {
        // Boost seguro: impulsão controlada + timer
        if (player.boostTimer <= 0) {
          player.boostTimer = 32;
          player.vy = -7.2; // impulsão limpa
          player.grounded = false;
        }
      } else if (bestSeg.type === 'rampUp' || bestSeg.type === 'rampDown') {
        player.onRamp = true;
        const slope = getSegmentSlope(bestSeg);
        const rampAngle = Math.atan(slope);
        if (!player.wheelie) {
          player.angle = player.angle * 0.6 + rampAngle * 0.4;
        }
      } else {
        if (!player.wheelie) player.angle *= 0.8;
      }
    }
  }

  // Coletar gatinhos
  for (const cat of cats) {
    if (cat.collected) continue;
    const cx = cat.x + cat.w / 2;
    const cy = cat.y + cat.h / 2 + Math.sin(Date.now() / 200 + cat.bob) * 6;
    const px = player.x + player.w / 2;
    const py = player.y + player.h / 2;
    if (Math.abs(px - cx) < 40 && Math.abs(py - cy) < 40) {
      cat.collected = true;
      updateMenuCount();
      const slot = document.getElementById('slot' + cat.id);
      if (slot) {
        slot.classList.add('got');
        slot.textContent = '🐱';
      }
    }
  }

  // Queda
  if (player.y > H + 200) {
    player.x = 160;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    player.angle = 0;
    player.boostTimer = 0;
    camX = 0;
  }

  // Câmera
  const targetCam = player.x - W * 0.30;
  camX += (targetCam - camX) * 0.13;
  if (camX < 0) camX = 0;

  document.getElementById('dist').textContent = Math.max(0, Math.floor((player.x - 160) / 10));
}

// ========== DRAW ==========
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0f0c29');
  grad.addColorStop(0.55, '#302b63');
  grad.addColorStop(1, '#24243e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#fff';
  for (let i = 0; i < 50; i++) {
    const sx = ((i * 149 + camX * 0.1) % (W + 40)) - 20;
    const sy = (i * 89) % (H * 0.48);
    ctx.globalAlpha = 0.3 + (i % 4) * 0.15;
    ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#1a1a2e';
  for (let i = 0; i < 6; i++) {
    const mx = ((i * 260) - camX * 0.22) % (W + 300) - 100;
    ctx.beginPath();
    ctx.moveTo(mx, H);
    ctx.lineTo(mx + 130, H - 95 - (i % 3) * 30);
    ctx.lineTo(mx + 260, H);
    ctx.fill();
  }
}

function drawSegment(seg) {
  const sx = seg.x - camX;
  if (sx + seg.w < -50 || sx > W + 50) return;

  if (seg.type === 'ground') {
    ctx.fillStyle = '#2d3436';
    ctx.fillRect(sx, seg.y, seg.w, seg.h);
    ctx.fillStyle = '#636e72';
    ctx.fillRect(sx, seg.y, seg.w, 6);
    ctx.fillStyle = '#b2bec3';
    for (let i = 0; i < seg.w; i += 68) ctx.fillRect(sx + i, seg.y + 2, 30, 3);
    ctx.fillStyle = '#00b894';
    ctx.fillRect(sx, seg.y - 5, seg.w, 6);
  }
  else if (seg.type === 'platform') {
    ctx.fillStyle = '#6c5ce7';
    ctx.fillRect(sx, seg.y, seg.w, seg.h);
    ctx.fillStyle = '#a29bfe';
    ctx.fillRect(sx, seg.y, seg.w, 5);
  }
  else if (seg.type === 'rampUp') {
    ctx.beginPath();
    ctx.moveTo(sx, seg.y + 6);
    ctx.lineTo(sx + seg.w, seg.y - seg.h + 6);
    ctx.lineTo(sx + seg.w, seg.y + 90);
    ctx.lineTo(sx, seg.y + 90);
    ctx.closePath();
    ctx.fillStyle = '#2d3436';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sx, seg.y);
    ctx.lineTo(sx + seg.w, seg.y - seg.h);
    ctx.lineTo(sx + seg.w, seg.y - seg.h + 7);
    ctx.lineTo(sx, seg.y + 7);
    ctx.closePath();
    ctx.fillStyle = '#00b894';
    ctx.fill();
  }
  else if (seg.type === 'rampDown') {
    ctx.beginPath();
    ctx.moveTo(sx, seg.y + 6);
    ctx.lineTo(sx + seg.w, seg.y + seg.h + 6);
    ctx.lineTo(sx + seg.w, seg.y + seg.h + 90);
    ctx.lineTo(sx, seg.y + 90);
    ctx.closePath();
    ctx.fillStyle = '#2d3436';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sx, seg.y);
    ctx.lineTo(sx + seg.w, seg.y + seg.h);
    ctx.lineTo(sx + seg.w, seg.y + seg.h + 7);
    ctx.lineTo(sx, seg.y + 7);
    ctx.closePath();
    ctx.fillStyle = '#00b894';
    ctx.fill();
  }
  else if (seg.type === 'boost') {
    const pulse = 0.55 + Math.sin(Date.now() / 110) * 0.45;
    ctx.fillStyle = `rgba(255,190,0,${pulse})`;
    ctx.fillRect(sx, seg.y, seg.w, seg.h);
    ctx.fillStyle = '#ff9f1a';
    ctx.fillRect(sx + 3, seg.y + 3, seg.w - 6, seg.h - 6);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px Courier New';
    ctx.fillText('>> BOOST', sx + 8, seg.y + 14);
  }
}

function drawCats() {
  for (const cat of cats) {
    if (cat.collected) continue;
    const sx = cat.x - camX;
    if (sx < -40 || sx > W + 40) continue;
    const bob = Math.sin(Date.now() / 220 + cat.bob) * 6;
    const sy = cat.y + bob;

    // tenta imagem
    const img = catImgs[cat.id % catImgs.length];
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, sx, sy, cat.w, cat.h);
    } else {
      // fallback pixel cat
      ctx.fillStyle = '#ff9ff3';
      ctx.fillRect(sx + 6, sy + 10, 24, 20);
      ctx.fillStyle = '#feca57';
      ctx.fillRect(sx + 10, sy + 4, 16, 12); // cabeça
      ctx.fillStyle = '#2d3436';
      ctx.fillRect(sx + 12, sy + 8, 4, 4);
      ctx.fillRect(sx + 20, sy + 8, 4, 4);
      // orelhas
      ctx.fillStyle = '#ff9ff3';
      ctx.fillRect(sx + 8, sy, 6, 8);
      ctx.fillRect(sx + 22, sy, 6, 8);
    }
  }
}

function drawPlayer() {
  const px = player.x - camX;
  const py = player.y;

  ctx.save();
  ctx.translate(px + player.w * 0.38, py + player.h * 0.72);
  ctx.rotate(player.angle);

  if (imgPlayer.complete && imgPlayer.naturalWidth > 0) {
    ctx.drawImage(imgPlayer, -player.w * 0.38, -player.h * 0.72, player.w, player.h);
  } else {
    ctx.fillStyle = '#111';
    ctx.fillRect(-30, -8, 24, 24);
    ctx.fillStyle = '#555';
    ctx.fillRect(-24, -2, 12, 12);
    ctx.fillStyle = '#111';
    ctx.fillRect(24, -8, 22, 22);
    ctx.fillStyle = '#555';
    ctx.fillRect(29, -2, 12, 12);
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(-18, -20, 50, 16);
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(-6, -30, 30, 14);
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(24, -38, 6, 22);
    ctx.fillRect(18, -40, 18, 6);
    ctx.fillStyle = '#3498db';
    ctx.fillRect(-2, -44, 16, 20);
    ctx.fillStyle = '#f1c40f';
    ctx.fillRect(0, -56, 14, 14);
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(3, -52, 9, 5);
    ctx.fillStyle = '#3498db';
    ctx.fillRect(12, -38, 14, 7);
  }
  ctx.restore();

  if (player.boostTimer > 0) {
    ctx.fillStyle = 'rgba(255,180,0,0.85)';
    ctx.font = 'bold 13px Courier New';
    ctx.fillText('BOOST!', px, py - 18);
  }
  if (player.wheelie) {
    ctx.fillStyle = '#00ff88';
    ctx.font = '12px Courier New';
    ctx.fillText('WHEELIE!', px - 6, py - 34);
  }
}

function draw() {
  drawBackground();
  for (const seg of level) drawSegment(seg);
  drawCats();
  drawPlayer();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
