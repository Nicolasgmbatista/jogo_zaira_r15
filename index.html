<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moto Pixel - Gatinhos Infinitos</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0d0d;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  user-select: none;
}
canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  border: 4px solid #222;
  background: #1a1a2e;
  max-width: 100%;
  height: auto;
}
#hud {
  display: none;
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  text-align: center;
  pointer-events: none;
  text-shadow: 2px 2px 0 #000;
  font-size: 15px;
  line-height: 1.45;
}
#hint {
  display: none;
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: #777;
  font-size: 12px;
  text-shadow: 1px 1px 0 #000;
  pointer-events: none;
}
/* ===== MENUS ===== */
.panel {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(8,8,16,0.92);
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 20;
}
.panel.open { display: flex; }
.panel h1 {
  color: #ff9ff3;
  font-size: 36px;
  margin-bottom: 8px;
  text-shadow: 3px 3px 0 #000;
}
.panel h2 {
  color: #ff9ff3;
  font-size: 26px;
  margin-bottom: 14px;
  text-shadow: 2px 2px 0 #000;
}
.panel p { color: #aaa; font-size: 14px; margin-bottom: 18px; }
.btn {
  padding: 12px 36px;
  margin: 8px;
  background: #6c5ce7;
  color: #fff;
  border: 3px solid #a29bfe;
  font-family: inherit;
  font-size: 16px;
  cursor: pointer;
  min-width: 200px;
}
.btn:hover { background: #a29bfe; color: #111; }
.btn.secondary { background: #2d3436; border-color: #636e72; }
.btn.secondary:hover { background: #636e72; color: #fff; }

#collectionGrid {
  display: grid;
  grid-template-columns: repeat(4, 90px);
  gap: 14px;
  max-height: 320px;
  overflow-y: auto;
  margin-bottom: 16px;
  padding: 8px;
}
.cat-card {
  width: 90px;
  background: #1e1e2e;
  border: 3px solid #444;
  padding: 6px;
  text-align: center;
  cursor: pointer;
}
.cat-card.got { border-color: #ff9ff3; }
.cat-card .swatch {
  width: 48px;
  height: 48px;
  margin: 0 auto 4px;
  image-rendering: pixelated;
}
.cat-card .name {
  color: #ddd;
  font-size: 10px;
  line-height: 1.2;
}
.cat-card.locked .name { color: #555; }

#detail {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  background: #1a1a2e;
  border: 4px solid #ff9ff3;
  padding: 20px 28px;
  max-width: 340px;
  z-index: 30;
  text-align: center;
}
#detail.open { display: block; }
#detail h3 { color: #ff9ff3; margin-bottom: 8px; font-size: 18px; }
#detail .big-swatch {
  width: 80px;
  height: 80px;
  margin: 10px auto;
  image-rendering: pixelated;
}
#detail p { color: #ccc; font-size: 13px; line-height: 1.4; margin-bottom: 12px; }
#detail .close-detail {
  padding: 6px 18px;
  background: #6c5ce7;
  border: 2px solid #a29bfe;
  color: #fff;
  font-family: inherit;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>

<div id="hud">
  DISTÂNCIA: <span id="dist">0</span>m<br>
  GATINHOS: <span id="cats">0</span>
  &nbsp;|&nbsp; [M] Menu
</div>
<div id="hint">A ←  D →  |  W = EMPINAR  |  Pegue os gatinhos  |  BOOST nas rampas</div>

<!-- MENU PRINCIPAL -->
<div id="mainMenu" class="panel open">
  <h1>MOTO PIXEL</h1>
  <p>Colete gatinhos na pista infinita</p>
  <button class="btn" id="btnPlay">JOGAR</button>
  <button class="btn secondary" id="btnCollection">COLEÇÃO</button>
</div>

<!-- COLEÇÃO -->
<div id="collectionMenu" class="panel">
  <h2>Coleção de Gatinhos</h2>
  <p id="colCount">0 coletados</p>
  <div id="collectionGrid"></div>
  <button class="btn secondary" id="btnBack">VOLTAR</button>
</div>

<!-- DETALHE DO GATINHO -->
<div id="detail">
  <h3 id="dName"></h3>
  <canvas id="dSwatch" class="big-swatch" width="80" height="80"></canvas>
  <p id="dDesc"></p>
  <button class="close-detail" id="btnCloseDetail">Fechar</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = canvas.width;
const H = canvas.height;

const imgPlayer = new Image();
imgPlayer.src = 'img/player.png';

// ========== CATÁLOGO DE GATINHOS (cores + misturas + curiosidades) ==========
const CAT_DATA = [
  { name: "Carvão",      colors: ["#1a1a1a","#333"],          mix: false, desc: "Preto puro. Dorme 18h por dia e ainda acorda cansado." },
  { name: "Neve",        colors: ["#f5f5f5","#ddd"],          mix: false, desc: "Branco total. Seu miado é tão baixo que parece um suspiro." },
  { name: "Laranja",     colors: ["#e67e22","#d35400"],       mix: false, desc: "Laranja clássico. Tem 50% mais chance de se perder em caixas." },
  { name: "Cinza",       colors: ["#7f8c8d","#95a5a6"],       mix: false, desc: "Cinza sólido. Especialista em sumir em sofás da mesma cor." },
  { name: "Chocolate",   colors: ["#6d4c41","#4e342e"],       mix: false, desc: "Marrom escuro. Odeia água, mas ama torneiras pingando." },
  { name: "Creme",       colors: ["#f5e6c8","#e8d5a3"],       mix: false, desc: "Tom creme. Derrete de preguiça ao sol das 15h." },
  { name: "Tigrado",     colors: ["#e67e22","#2c3e50"],       mix: true,  desc: "Laranja + preto. Corre na velocidade da luz… até ver um laser." },
  { name: "Calico",      colors: ["#e74c3c","#f5f5f5","#2c3e50"], mix: true, desc: "Tricolor. Quase sempre fêmea e rainha absoluta da casa." },
  { name: "Siamês",      colors: ["#f5e6c8","#4a3728"],       mix: true,  desc: "Creme com pontas escuras. Conversador nato, nunca cala a boca." },
  { name: "Fumaça",      colors: ["#bdc3c7","#2c3e50"],       mix: true,  desc: "Cinza com base preta. Aparece e some como um fantasma." },
  { name: "Dourado",     colors: ["#f1c40f","#e67e22"],       mix: true,  desc: "Amarelo dourado. Acredita ser o sol personificado." },
  { name: "Azul-Russo",  colors: ["#5d6d7e","#85929e"],       mix: false, desc: "Azul-acinzentado. Elegante, reservado e viciado em carinho na cabeça." },
  { name: "Rosa-Algodão",colors: ["#ff9ff3","#feca57"],       mix: true,  desc: "Rosa com toques amarelos. Existe só neste jogo… e no seu coração." },
  { name: "Menta",       colors: ["#1dd1a1","#10ac84"],       mix: false, desc: "Verde-menta. Adora plantas e finge que não derrubou o vaso." },
  { name: "Céu",         colors: ["#54a0ff","#2e86de"],       mix: false, desc: "Azul céu. Passa o dia olhando pela janela julgando os pássaros." },
  { name: "Uva",         colors: ["#5f27cd","#341f97"],       mix: false, desc: "Roxo profundo. Misterioso e especialista em sumir às 3h da manhã." },
  { name: "Arco-Íris",   colors: ["#ff6b6b","#feca57","#1dd1a1","#54a0ff"], mix: true, desc: "Todas as cores. Dizem que dá sorte… e pelos em tudo quanto é lugar." },
  { name: "Sombra",      colors: ["#2c3e50","#1a1a2e"],       mix: true,  desc: "Preto azulado. Só é visto quando quer ser visto." },
  { name: "Pêssego",     colors: ["#ff9f43","#feca57"],       mix: true,  desc: "Laranja claro. Derrete no colo em exatamente 4 segundos." },
  { name: "Prata",       colors: ["#dfe6e9","#b2bec3"],       mix: false, desc: "Prateado brilhante. Reflete a luz e sua própria vaidade." }
];

// ========== ESTADO ==========
let state = 'menu'; // menu | playing | collection
let collected = new Set(); // ids dos gatinhos pegos
let nextCatId = 0;

const player = {
  x: 160, y: 300, vx: 0, vy: 0,
  w: 90, h: 58, angle: 0,
  grounded: false, onRamp: false, wheelie: false, boostTimer: 0
};
let camX = 0;

const GRAVITY = 0.48;
const MAX_SPEED = 9.5;
const ACCEL = 0.30;
const FRICTION = 0.935;
const WHEELIE_TORQUE = 0.085;
const MAX_WHEELIE = 1.1;

// ========== NÍVEL INFINITO ==========
const level = [];
const cats = [];
let lastGroundX = 0;
let lastCatX = 0;

function addGround(x, w) {
  level.push({ type: 'ground', x, y: 420, w, h: 130 });
  lastGroundX = x + w;
}

function addRampBoostGap() {
  const rampW = 180 + Math.random() * 80;
  const rampH = 120 + Math.random() * 50;
  const gap = 220 + Math.random() * 120;
  const boostW = 80 + Math.random() * 40;

  level.push({ type: 'rampUp', x: lastGroundX, y: 420, w: rampW, h: rampH });
  level.push({ type: 'boost',  x: lastGroundX + rampW * 0.55, y: 420 - rampH + 10, w: boostW, h: 18 });

  // possível plataforma alternativa
  if (Math.random() > 0.45) {
    level.push({
      type: 'platform',
      x: lastGroundX + rampW + gap * 0.3,
      y: 250 + Math.random() * 80,
      w: 120 + Math.random() * 80,
      h: 24
    });
  }

  const nextX = lastGroundX + rampW + gap;
  const groundW = 400 + Math.random() * 350;
  addGround(nextX, groundW);
}

function spawnCat() {
  // distância maior entre gatinhos
  const minDist = 700;
  const maxDist = 1400;
  lastCatX += minDist + Math.random() * (maxDist - minDist);

  // escolhe um tipo ainda não coletado ou qualquer
  const typeId = nextCatId % CAT_DATA.length;
  nextCatId++;

  // altura: no chão ou em plataforma se houver
  let cy = 375;
  for (const seg of level) {
    if (seg.type === 'platform' && lastCatX > seg.x && lastCatX < seg.x + seg.w) {
      cy = seg.y - 45;
      break;
    }
  }

  cats.push({
    x: lastCatX,
    y: cy,
    w: 38, h: 38,
    typeId,
    collected: false,
    bob: Math.random() * Math.PI * 2
  });
}

function generateAhead() {
  while (lastGroundX < camX + W + 900) {
    if (Math.random() > 0.35) {
      addRampBoostGap();
    } else {
      const w = 500 + Math.random() * 400;
      addGround(lastGroundX, w);
      // pequena rampa decorativa
      if (Math.random() > 0.6) {
        level.push({
          type: 'rampUp',
          x: lastGroundX - w * 0.4,
          y: 420,
          w: 140,
          h: 70
        });
        level.push({
          type: 'platform',
          x: lastGroundX - w * 0.4 + 140,
          y: 350,
          w: 180,
          h: 24
        });
      }
    }
  }

  while (lastCatX < camX + W + 1200) {
    spawnCat();
  }

  // limpa segmentos muito atrás
  while (level.length && level[0].x + (level[0].w || 0) < camX - 600) {
    level.shift();
  }
  while (cats.length && cats[0].x < camX - 400) {
    cats.shift();
  }
}

function resetGame() {
  level.length = 0;
  cats.length = 0;
  lastGroundX = 0;
  lastCatX = 200;
  nextCatId = 0;
  player.x = 160;
  player.y = 300;
  player.vx = 0;
  player.vy = 0;
  player.angle = 0;
  player.boostTimer = 0;
  camX = 0;
  addGround(0, 700);
  generateAhead();
}

// ========== DESENHO DE GATINHO PIXEL ==========
function drawCatPixel(ctx2, data, size, ox = 0, oy = 0) {
  const s = size / 16;
  // corpo
  ctx2.fillStyle = data.colors[0];
  ctx2.fillRect(ox + 3*s, oy + 7*s, 10*s, 7*s);
  // cabeça
  ctx2.fillStyle = data.colors[0];
  ctx2.fillRect(ox + 4*s, oy + 2*s, 8*s, 6*s);
  // orelhas
  ctx2.fillRect(ox + 3*s, oy + 0*s, 3*s, 4*s);
  ctx2.fillRect(ox + 10*s, oy + 0*s, 3*s, 4*s);
  // mistura de cores
  if (data.mix && data.colors.length > 1) {
    ctx2.fillStyle = data.colors[1];
    ctx2.fillRect(ox + 8*s, oy + 3*s, 4*s, 5*s);
    ctx2.fillRect(ox + 5*s, oy + 9*s, 5*s, 4*s);
    if (data.colors[2]) {
      ctx2.fillStyle = data.colors[2];
      ctx2.fillRect(ox + 4*s, oy + 4*s, 3*s, 3*s);
    }
    if (data.colors[3]) {
      ctx2.fillStyle = data.colors[3];
      ctx2.fillRect(ox + 9*s, oy + 10*s, 3*s, 3*s);
    }
  }
  // olhos
  ctx2.fillStyle = '#2d3436';
  ctx2.fillRect(ox + 5*s, oy + 4*s, 2*s, 2*s);
  ctx2.fillRect(ox + 9*s, oy + 4*s, 2*s, 2*s);
  // focinho
  ctx2.fillStyle = '#ff9ff3';
  ctx2.fillRect(ox + 7*s, oy + 6*s, 2*s, 1*s);
}

// ========== UI COLEÇÃO ==========
function rebuildCollection() {
  const grid = document.getElementById('collectionGrid');
  grid.innerHTML = '';
  CAT_DATA.forEach((data, i) => {
    const got = collected.has(i);
    const card = document.createElement('div');
    card.className = 'cat-card' + (got ? ' got' : ' locked');
    const cnv = document.createElement('canvas');
    cnv.width = 48; cnv.height = 48;
    cnv.className = 'swatch';
    const c = cnv.getContext('2d');
    c.imageSmoothingEnabled = false;
    if (got) {
      drawCatPixel(c, data, 48);
    } else {
      c.fillStyle = '#333';
      c.fillRect(8, 8, 32, 32);
      c.fillStyle = '#555';
      c.font = '20px monospace';
      c.fillText('?', 18, 30);
    }
    card.appendChild(cnv);
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = got ? data.name : '???';
    card.appendChild(name);
    if (got) {
      card.onclick = () => showDetail(i);
    }
    grid.appendChild(card);
  });
  document.getElementById('colCount').textContent = collected.size + ' / ' + CAT_DATA.length + ' coletados';
  document.getElementById('cats').textContent = collected.size;
}

function showDetail(id) {
  const data = CAT_DATA[id];
  document.getElementById('dName').textContent = data.name;
  document.getElementById('dDesc').textContent = data.desc;
  const cnv = document.getElementById('dSwatch');
  const c = cnv.getContext('2d');
  c.imageSmoothingEnabled = false;
  c.clearRect(0, 0, 80, 80);
  drawCatPixel(c, data, 80);
  document.getElementById('detail').classList.add('open');
}

// ========== INPUT ==========
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyM' || e.code === 'Escape') {
    if (state === 'playing') openMainMenu();
    else if (state === 'collection') openMainMenu();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

document.getElementById('btnPlay').onclick = () => {
  state = 'playing';
  document.getElementById('mainMenu').classList.remove('open');
  document.getElementById('collectionMenu').classList.remove('open');
  document.getElementById('hud').style.display = 'block';
  document.getElementById('hint').style.display = 'block';
  resetGame();
};
document.getElementById('btnCollection').onclick = () => {
  state = 'collection';
  document.getElementById('mainMenu').classList.remove('open');
  document.getElementById('collectionMenu').classList.add('open');
  rebuildCollection();
};
document.getElementById('btnBack').onclick = openMainMenu;
document.getElementById('btnCloseDetail').onclick = () => {
  document.getElementById('detail').classList.remove('open');
};

function openMainMenu() {
  state = 'menu';
  document.getElementById('mainMenu').classList.add('open');
  document.getElementById('collectionMenu').classList.remove('open');
  document.getElementById('detail').classList.remove('open');
  document.getElementById('hud').style.display = 'none';
  document.getElementById('hint').style.display = 'none';
}

// ========== FÍSICA ==========
function getSegmentY(seg, px) {
  if (seg.type === 'ground' || seg.type === 'platform' || seg.type === 'boost') return seg.y;
  if (seg.type === 'rampUp') {
    const t = Math.max(0, Math.min(1, (px - seg.x) / seg.w));
    return seg.y - t * seg.h;
  }
  if (seg.type === 'rampDown') {
    const t = Math.max(0, Math.min(1, (px - seg.x) / seg.w));
    return seg.y + t * seg.h;
  }
  return seg.y;
}
function getSegmentSlope(seg) {
  if (seg.type === 'rampUp') return -seg.h / seg.w;
  if (seg.type === 'rampDown') return seg.h / seg.w;
  return 0;
}

function update() {
  if (state !== 'playing') return;

  if (keys['KeyD'] || keys['ArrowRight']) player.vx += ACCEL;
  if (keys['KeyA'] || keys['ArrowLeft'])  player.vx -= ACCEL;
  player.vx = Math.max(-MAX_SPEED * 0.6, Math.min(MAX_SPEED, player.vx));
  if (player.grounded) player.vx *= FRICTION;
  else player.vx *= 0.997;

  if (keys['KeyW'] || keys['ArrowUp']) {
    if (player.grounded || player.onRamp) {
      player.angle -= WHEELIE_TORQUE;
      player.wheelie = true;
    }
  } else {
    player.wheelie = false;
    if (player.grounded || player.onRamp) player.angle *= 0.9;
    else player.angle *= 0.97;
  }
  player.angle = Math.max(-MAX_WHEELIE, Math.min(0.15, player.angle));

  if (player.boostTimer > 0) {
    player.boostTimer--;
    player.vx = Math.min(player.vx + 0.5, MAX_SPEED + 5);
  }

  player.vy += GRAVITY;
  if (player.vy > 15) player.vy = 15;

  player.x += player.vx;
  player.y += player.vy;

  // colisão
  player.grounded = false;
  player.onRamp = false;
  const feetX = player.x + player.w * 0.42;
  const feetY = player.y + player.h;

  let bestY = null, bestSeg = null;
  for (const seg of level) {
    if (feetX < seg.x - 8 || feetX > seg.x + seg.w + 8) continue;
    const surfaceY = getSegmentY(seg, feetX);
    if (feetY >= surfaceY - 14 && player.y + player.h * 0.35 < surfaceY + 35) {
      if (bestY === null || surfaceY < bestY) {
        bestY = surfaceY;
        bestSeg = seg;
      }
    }
  }

  if (bestSeg && bestY !== null) {
    if (player.vy >= -2 || feetY >= bestY - 6) {
      player.y = bestY - player.h;
      player.vy = 0;
      player.grounded = true;

      if (bestSeg.type === 'boost') {
        if (player.boostTimer <= 0) {
          player.boostTimer = 30;
          player.vy = -7.0;
          player.grounded = false;
        }
      } else if (bestSeg.type === 'rampUp' || bestSeg.type === 'rampDown') {
        player.onRamp = true;
        const rampAngle = Math.atan(getSegmentSlope(bestSeg));
        if (!player.wheelie) player.angle = player.angle * 0.55 + rampAngle * 0.45;
      } else if (!player.wheelie) {
        player.angle *= 0.8;
      }
    }
  }

  // coletar gatinhos
  for (const cat of cats) {
    if (cat.collected) continue;
    const cx = cat.x + 19;
    const cy = cat.y + 19 + Math.sin(Date.now() / 200 + cat.bob) * 5;
    if (Math.abs(player.x + 45 - cx) < 42 && Math.abs(player.y + 30 - cy) < 42) {
      cat.collected = true;
      collected.add(cat.typeId);
      document.getElementById('cats').textContent = collected.size;
    }
  }

  if (player.y > H + 220) {
    player.x = Math.max(160, player.x - 400);
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    player.angle = 0;
    player.boostTimer = 0;
  }

  const targetCam = player.x - W * 0.28;
  camX += (targetCam - camX) * 0.12;
  if (camX < 0) camX = 0;

  generateAhead();
  document.getElementById('dist').textContent = Math.max(0, Math.floor((player.x - 160) / 10));
}

// ========== DRAW ==========
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0f0c29');
  grad.addColorStop(0.5, '#302b63');
  grad.addColorStop(1, '#24243e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#fff';
  for (let i = 0; i < 45; i++) {
    const sx = ((i * 157 + camX * 0.08) % (W + 30)) - 15;
    const sy = (i * 91) % (H * 0.45);
    ctx.globalAlpha = 0.25 + (i % 3) * 0.2;
    ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.globalAlpha = 1;
}

function drawSegment(seg) {
  const sx = seg.x - camX;
  if (sx + (seg.w || 0) < -40 || sx > W + 40) return;

  if (seg.type === 'ground') {
    ctx.fillStyle = '#2d3436';
    ctx.fillRect(sx, seg.y, seg.w, seg.h);
    ctx.fillStyle = '#636e72';
    ctx.fillRect(sx, seg.y, seg.w, 5);
    ctx.fillStyle = '#00b894';
    ctx.fillRect(sx, seg.y - 4, seg.w, 5);
  } else if (seg.type === 'platform') {
    ctx.fillStyle = '#6c5ce7';
    ctx.fillRect(sx, seg.y, seg.w, seg.h);
    ctx.fillStyle = '#a29bfe';
    ctx.fillRect(sx, seg.y, seg.w, 4);
  } else if (seg.type === 'rampUp') {
    ctx.beginPath();
    ctx.moveTo(sx, seg.y + 5);
    ctx.lineTo(sx + seg.w, seg.y - seg.h + 5);
    ctx.lineTo(sx + seg.w, seg.y + 80);
    ctx.lineTo(sx, seg.y + 80);
    ctx.closePath();
    ctx.fillStyle = '#2d3436';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sx, seg.y);
    ctx.lineTo(sx + seg.w, seg.y - seg.h);
    ctx.lineTo(sx + seg.w, seg.y - seg.h + 6);
    ctx.lineTo(sx, seg.y + 6);
    ctx.closePath();
    ctx.fillStyle = '#00b894';
    ctx.fill();
  } else if (seg.type === 'boost') {
    const pulse = 0.5 + Math.sin(Date.now() / 100) * 0.5;
    ctx.fillStyle = `rgba(255,190,0,${pulse})`;
    ctx.fillRect(sx, seg.y, seg.w, seg.h);
    ctx.fillStyle = '#ff9f1a';
    ctx.fillRect(sx + 2, seg.y + 2, seg.w - 4, seg.h - 4);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px Courier New';
    ctx.fillText('BOOST', sx + 6, seg.y + 13);
  }
}

function drawCats() {
  for (const cat of cats) {
    if (cat.collected) continue;
    const sx = cat.x - camX;
    if (sx < -50 || sx > W + 50) continue;
    const bob = Math.sin(Date.now() / 220 + cat.bob) * 5;
    drawCatPixel(ctx, CAT_DATA[cat.typeId], 38, sx, cat.y + bob);
  }
}

function drawPlayer() {
  const px = player.x - camX;
  const py = player.y;
  ctx.save();
  ctx.translate(px + player.w * 0.38, py + player.h * 0.72);
  ctx.rotate(player.angle);

  if (imgPlayer.complete && imgPlayer.naturalWidth > 0) {
    ctx.drawImage(imgPlayer, -player.w * 0.38, -player.h * 0.72, player.w, player.h);
  } else {
    ctx.fillStyle = '#111'; ctx.fillRect(-30, -8, 24, 24);
    ctx.fillStyle = '#555'; ctx.fillRect(-24, -2, 12, 12);
    ctx.fillStyle = '#111'; ctx.fillRect(24, -8, 22, 22);
    ctx.fillStyle = '#555'; ctx.fillRect(29, -2, 12, 12);
    ctx.fillStyle = '#c0392b'; ctx.fillRect(-18, -20, 50, 16);
    ctx.fillStyle = '#e74c3c'; ctx.fillRect(-6, -30, 30, 14);
    ctx.fillStyle = '#2c3e50'; ctx.fillRect(24, -38, 6, 22);
    ctx.fillRect(18, -40, 18, 6);
    ctx.fillStyle = '#3498db'; ctx.fillRect(-2, -44, 16, 20);
    ctx.fillStyle = '#f1c40f'; ctx.fillRect(0, -56, 14, 14);
    ctx.fillStyle = '#2c3e50'; ctx.fillRect(3, -52, 9, 5);
    ctx.fillStyle = '#3498db'; ctx.fillRect(12, -38, 14, 7);
  }
  ctx.restore();

  if (player.boostTimer > 0) {
    ctx.fillStyle = 'rgba(255,180,0,0.9)';
    ctx.font = 'bold 12px Courier New';
    ctx.fillText('BOOST!', px, py - 16);
  }
}

function draw() {
  drawBackground();
  if (state === 'playing') {
    for (const seg of level) drawSegment(seg);
    drawCats();
    drawPlayer();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
