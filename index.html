<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moto Pixel - Ramps & Paths</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0d0d;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  user-select: none;
}
canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  border: 4px solid #222;
  background: #1a1a2e;
  max-width: 100%;
  height: auto;
}
#ui {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  text-align: center;
  pointer-events: none;
  text-shadow: 2px 2px 0 #000;
  font-size: 18px;
}
#hint {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  color: #888;
  font-size: 13px;
  text-shadow: 1px 1px 0 #000;
  pointer-events: none;
}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="ui">DISTÂNCIA: <span id="dist">0</span>m</div>
<div id="hint">A ←  D →  |  W = EMPINAR  |  Chegue o mais longe possível</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const W = canvas.width;
const H = canvas.height;

// ========== IMAGENS (pasta img/) ==========
// player.png  → moto + personagem (~96x64 px recomendado)
// ramp.png    → opcional (tile de rampa)
const imgPlayer = new Image();
imgPlayer.src = 'img/player.png';

// ========== FÍSICA ==========
const GRAVITY = 0.55;
const MAX_SPEED = 9;
const ACCEL = 0.28;
const FRICTION = 0.92;
const WHEELIE_TORQUE = 0.08;
const WHEELIE_RETURN = 0.04;
const MAX_WHEELIE = 1.1; // radianos (~63°)

// ========== PLAYER ==========
const player = {
  x: 180,
  y: 300,
  vx: 0,
  vy: 0,
  w: 90,
  h: 58,
  angle: 0,          // rotação da moto (wheelie)
  grounded: false,
  onRamp: false,
  wheelie: false
};

// ========== CÂMERA ==========
let camX = 0;

// ========== NÍVEL (plataformas + rampas) ==========
// type: 'ground' | 'platform' | 'rampUp' | 'rampDown'
const level = [];

function buildLevel() {
  level.length = 0;

  // Chão inicial longo
  level.push({ type: 'ground', x: 0, y: 420, w: 700, h: 120 });

  // Rampa subindo + plataforma alta (caminho superior)
  level.push({ type: 'rampUp', x: 700, y: 420, w: 180, h: 90 });
  level.push({ type: 'platform', x: 880, y: 330, w: 320, h: 30 });
  level.push({ type: 'rampDown', x: 1200, y: 330, w: 160, h: 90 });

  // Caminho inferior (alternativa)
  level.push({ type: 'ground', x: 700, y: 420, w: 900, h: 120 });

  // Segunda rampa + plataforma média
  level.push({ type: 'rampUp', x: 1600, y: 420, w: 200, h: 110 });
  level.push({ type: 'platform', x: 1800, y: 310, w: 280, h: 28 });
  level.push({ type: 'rampDown', x: 2080, y: 310, w: 150, h: 110 });

  // Chão intermediário
  level.push({ type: 'ground', x: 1600, y: 420, w: 800, h: 120 });

  // Plataforma alta isolada (pulo com wheelie ajuda)
  level.push({ type: 'platform', x: 2450, y: 260, w: 200, h: 26 });

  // Rampa grande final
  level.push({ type: 'rampUp', x: 2700, y: 420, w: 280, h: 160 });
  level.push({ type: 'platform', x: 2980, y: 260, w: 400, h: 30 });
  level.push({ type: 'rampDown', x: 3380, y: 260, w: 200, h: 160 });

  // Chão contínuo
  level.push({ type: 'ground', x: 2700, y: 420, w: 1200, h: 120 });

  // Mais caminhos alternativos
  level.push({ type: 'platform', x: 3600, y: 340, w: 180, h: 24 });
  level.push({ type: 'platform', x: 3850, y: 280, w: 160, h: 24 });
  level.push({ type: 'platform', x: 4100, y: 220, w: 220, h: 24 });

  // Rampa final + chão infinito-ish
  level.push({ type: 'rampUp', x: 4400, y: 420, w: 220, h: 130 });
  level.push({ type: 'platform', x: 4620, y: 290, w: 350, h: 28 });
  level.push({ type: 'ground', x: 4400, y: 420, w: 2000, h: 120 });
}

buildLevel();

// ========== INPUT ==========
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
});

// ========== HELPERS DE COLISÃO ==========
function getSegmentY(seg, px) {
  // Retorna a altura do topo do segmento em px
  if (seg.type === 'ground' || seg.type === 'platform') {
    return seg.y;
  }
  if (seg.type === 'rampUp') {
    const t = Math.max(0, Math.min(1, (px - seg.x) / seg.w));
    return seg.y - t * seg.h;
  }
  if (seg.type === 'rampDown') {
    const t = Math.max(0, Math.min(1, (px - seg.x) / seg.w));
    return seg.y + t * seg.h;
  }
  return seg.y;
}

function getSegmentSlope(seg) {
  if (seg.type === 'rampUp') return -seg.h / seg.w;
  if (seg.type === 'rampDown') return seg.h / seg.w;
  return 0;
}

// ========== UPDATE ==========
function update() {
  // Aceleração
  if (keys['KeyD'] || keys['ArrowRight']) {
    player.vx += ACCEL;
  }
  if (keys['KeyA'] || keys['ArrowLeft']) {
    player.vx -= ACCEL;
  }

  // Limites de velocidade
  player.vx = Math.max(-MAX_SPEED * 0.7, Math.min(MAX_SPEED, player.vx));

  // Fricção no chão
  if (player.grounded) {
    player.vx *= FRICTION;
  } else {
    player.vx *= 0.995;
  }

  // Wheelie (W)
  if (keys['KeyW'] || keys['ArrowUp']) {
    if (player.grounded || player.onRamp) {
      player.angle += WHEELIE_TORQUE;
      player.wheelie = true;
    }
  } else {
    player.wheelie = false;
    // Retorna ao ângulo do chão
    if (player.grounded || player.onRamp) {
      player.angle *= (1 - WHEELIE_RETURN * 2);
    } else {
      // No ar o ângulo tende a estabilizar
      player.angle *= 0.98;
    }
  }
  player.angle = Math.max(-0.15, Math.min(MAX_WHEELIE, player.angle));

  // Gravidade
  player.vy += GRAVITY;

  // Movimento
  player.x += player.vx;
  player.y += player.vy;

  // Colisão com o nível
  player.grounded = false;
  player.onRamp = false;

  const feetX = player.x + player.w * 0.5;
  const feetY = player.y + player.h;

  for (const seg of level) {
    if (feetX < seg.x - 10 || feetX > seg.x + seg.w + 10) continue;

    const surfaceY = getSegmentY(seg, feetX);
    const slope = getSegmentSlope(seg);

    // Só colide se estiver caindo ou quase no chão
    if (player.vy >= -1 && feetY >= surfaceY - 8 && feetY <= surfaceY + 18) {
      player.y = surfaceY - player.h;
      player.vy = 0;
      player.grounded = true;

      if (seg.type === 'rampUp' || seg.type === 'rampDown') {
        player.onRamp = true;
        // Ajusta ângulo base da rampa
        const rampAngle = Math.atan(slope);
        if (!player.wheelie) {
          player.angle = player.angle * 0.7 + rampAngle * 0.3;
        }
      } else {
        if (!player.wheelie) {
          player.angle *= 0.85;
        }
      }
      break;
    }
  }

  // Morte se cair muito
  if (player.y > H + 200) {
    // Respawn no início
    player.x = 180;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    player.angle = 0;
    camX = 0;
  }

  // Câmera segue o player
  const targetCam = player.x - W * 0.35;
  camX += (targetCam - camX) * 0.12;
  if (camX < 0) camX = 0;

  // Distância
  document.getElementById('dist').textContent = Math.max(0, Math.floor((player.x - 180) / 10));
}

// ========== DRAW ==========
function drawBackground() {
  // Céu
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0f0c29');
  grad.addColorStop(0.5, '#302b63');
  grad.addColorStop(1, '#24243e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Estrelas
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 60; i++) {
    const sx = ((i * 137 + camX * 0.15) % (W + 40)) - 20;
    const sy = (i * 97) % (H * 0.55);
    ctx.globalAlpha = 0.4 + (i % 3) * 0.2;
    ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.globalAlpha = 1;

  // Montanhas distantes
  ctx.fillStyle = '#1a1a2e';
  for (let i = 0; i < 8; i++) {
    const mx = ((i * 220) - camX * 0.3) % (W + 300) - 100;
    ctx.beginPath();
    ctx.moveTo(mx, H);
    ctx.lineTo(mx + 110, H - 90 - (i % 3) * 30);
    ctx.lineTo(mx + 220, H);
    ctx.fill();
  }
}

function drawSegment(seg) {
  const sx = seg.x - camX;
  if (sx + seg.w < -50 || sx > W + 50) return;

  ctx.save();

  if (seg.type === 'ground') {
    // Chão
    ctx.fillStyle = '#2d3436';
    ctx.fillRect(sx, seg.y, seg.w, seg.h);
    // Faixa
    ctx.fillStyle = '#636e72';
    ctx.fillRect(sx, seg.y, seg.w, 6);
    // Marcas
    ctx.fillStyle = '#b2bec3';
    for (let i = 0; i < seg.w; i += 70) {
      ctx.fillRect(sx + i, seg.y + 2, 35, 3);
    }
    // Grama
    ctx.fillStyle = '#00b894';
    ctx.fillRect(sx, seg.y - 4, seg.w, 5);
  }
  else if (seg.type === 'platform') {
    ctx.fillStyle = '#6c5ce7';
    ctx.fillRect(sx, seg.y, seg.w, seg.h);
    ctx.fillStyle = '#a29bfe';
    ctx.fillRect(sx, seg.y, seg.w, 5);
    // Detalhe pixel
    ctx.fillStyle = '#2d3436';
    for (let i = 8; i < seg.w; i += 16) {
      ctx.fillRect(sx + i, seg.y + 10, 4, 4);
    }
  }
  else if (seg.type === 'rampUp') {
    ctx.beginPath();
    ctx.moveTo(sx, seg.y + 8);
    ctx.lineTo(sx + seg.w, seg.y - seg.h + 8);
    ctx.lineTo(sx + seg.w, seg.y + 80);
    ctx.lineTo(sx, seg.y + 80);
    ctx.closePath();
    ctx.fillStyle = '#2d3436';
    ctx.fill();
    // Superfície
    ctx.beginPath();
    ctx.moveTo(sx, seg.y);
    ctx.lineTo(sx + seg.w, seg.y - seg.h);
    ctx.lineTo(sx + seg.w, seg.y - seg.h + 8);
    ctx.lineTo(sx, seg.y + 8);
    ctx.closePath();
    ctx.fillStyle = '#00b894';
    ctx.fill();
  }
  else if (seg.type === 'rampDown') {
    ctx.beginPath();
    ctx.moveTo(sx, seg.y + 8);
    ctx.lineTo(sx + seg.w, seg.y + seg.h + 8);
    ctx.lineTo(sx + seg.w, seg.y + seg.h + 80);
    ctx.lineTo(sx, seg.y + 80);
    ctx.closePath();
    ctx.fillStyle = '#2d3436';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sx, seg.y);
    ctx.lineTo(sx + seg.w, seg.y + seg.h);
    ctx.lineTo(sx + seg.w, seg.y + seg.h + 8);
    ctx.lineTo(sx, seg.y + 8);
    ctx.closePath();
    ctx.fillStyle = '#00b894';
    ctx.fill();
  }

  ctx.restore();
}

function drawPlayer() {
  const px = player.x - camX;
  const py = player.y;

  ctx.save();
  ctx.translate(px + player.w * 0.4, py + player.h * 0.7);
  ctx.rotate(player.angle);

  if (imgPlayer.complete && imgPlayer.naturalWidth > 0) {
    ctx.drawImage(imgPlayer, -player.w * 0.4, -player.h * 0.7, player.w, player.h);
  } else {
    // Fallback pixel art da moto
    // Roda traseira
    ctx.fillStyle = '#111';
    ctx.fillRect(-28, -6, 22, 22);
    ctx.fillStyle = '#444';
    ctx.fillRect(-23, -1, 12, 12);
    // Roda dianteira
    ctx.fillStyle = '#111';
    ctx.fillRect(22, -6, 20, 20);
    ctx.fillStyle = '#444';
    ctx.fillRect(26, -1, 11, 11);
    // Chassis
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(-18, -18, 48, 16);
    // Tanque
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(-5, -28, 28, 14);
    // Guidão
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(22, -36, 6, 22);
    ctx.fillRect(16, -38, 18, 6);
    // Personagem
    ctx.fillStyle = '#3498db';
    ctx.fillRect(-2, -42, 16, 20);
    // Capacete
    ctx.fillStyle = '#f1c40f';
    ctx.fillRect(0, -54, 14, 14);
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(3, -50, 9, 5);
    // Braço
    ctx.fillStyle = '#3498db';
    ctx.fillRect(12, -36, 14, 7);
  }

  ctx.restore();
}

function draw() {
  drawBackground();

  // Nível
  for (const seg of level) {
    drawSegment(seg);
  }

  // Player
  drawPlayer();

  // Indicador de wheelie
  if (player.wheelie) {
    ctx.fillStyle = '#00ff88';
    ctx.font = '14px Courier New';
    ctx.fillText('WHEELIE!', player.x - camX - 10, player.y - 20);
  }
}

// ========== LOOP ==========
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
