<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moto Pixel R15 - Gatinhos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Courier New',monospace;overflow:hidden;user-select:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;border:4px solid #222;max-width:100%;height:auto}
.panel{display:none;position:absolute;inset:0;background:rgba(6,6,14,.94);flex-direction:column;justify-content:center;align-items:center;z-index:30}
.panel.open{display:flex}
.panel h1{color:#ff9ff3;font-size:34px;text-shadow:3px 3px 0 #000;margin-bottom:6px}
.panel h2{color:#ff9ff3;font-size:24px;text-shadow:2px 2px 0 #000;margin-bottom:12px}
.panel p{color:#aaa;font-size:13px;margin-bottom:14px;text-align:center;max-width:420px;line-height:1.4}
.btn{padding:11px 28px;margin:6px;background:#6c5ce7;color:#fff;border:3px solid #a29bfe;font-family:inherit;font-size:15px;cursor:pointer;min-width:180px}
.btn:hover{background:#a29bfe;color:#111}
.btn.sec{background:#2d3436;border-color:#636e72}
.btn.sec:hover{background:#636e72;color:#fff}
#phaseGrid{display:grid;grid-template-columns:repeat(5,90px);gap:10px;margin:12px 0 18px}
.phaseBtn{width:90px;height:50px;background:#1e1e2e;border:3px solid #555;color:#ccc;font-family:inherit;font-size:13px;cursor:pointer}
.phaseBtn:hover{border-color:#ff9ff3;color:#fff}
#hud{display:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);color:#fff;text-align:center;pointer-events:none;text-shadow:2px 2px 0 #000;font-size:14px;line-height:1.4}
#hint{display:none;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);color:#666;font-size:11px;text-shadow:1px 1px 0 #000;pointer-events:none}
#collectionGrid{display:grid;grid-template-columns:repeat(5,78px);gap:10px;max-height:300px;overflow-y:auto;padding:6px;margin-bottom:12px}
.catCard{width:78px;background:#1a1a28;border:3px solid #444;padding:4px;text-align:center;cursor:pointer}
.catCard.got{border-color:#ff9ff3}
.catCard canvas{display:block;margin:0 auto 3px;image-rendering:pixelated}
.catCard .nm{color:#bbb;font-size:9px}
.catCard.locked .nm{color:#555}
#detail{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#141422;border:4px solid #ff9ff3;padding:18px 24px;max-width:320px;z-index:40;text-align:center}
#detail.open{display:block}
#detail h3{color:#ff9ff3;margin-bottom:6px}
#detail p{color:#ccc;font-size:12px;line-height:1.4;margin:8px 0 12px}
#finishPanel{display:none;position:absolute;inset:0;background:rgba(0,0,0,.88);flex-direction:column;justify-content:center;align-items:center;z-index:25}
#finishPanel.open{display:flex}
#finishPanel h2{color:#00ff88;font-size:28px;text-shadow:2px 2px 0 #000;margin-bottom:10px}
#finishPanel .stat{color:#ddd;font-size:14px;margin:4px 0}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>

<div id="hud">
  <span id="hudPhase"></span> | DIST <span id="dist">0</span>m | GATOS <span id="cats">0</span>/<span id="catsTotal">0</span> | TEMPO <span id="timer">0</span>s
  <br>[M] Menu
</div>
<div id="hint">A/D mover | W empinar | Pequenos obstáculos = empine para passar</div>

<!-- MENU PRINCIPAL -->
<div id="mainMenu" class="panel open">
  <h1>MOTO PIXEL R15</h1>
  <p>Sua namorada pilotando a Yamaha R15.<br>Resgate gatinhos nas pistas.</p>
  <button class="btn" id="btnJogar">JOGAR</button>
  <button class="btn sec" id="btnInfinita">PISTA INFINITA</button>
  <button class="btn sec" id="btnColecao">COLEÇÃO</button>
</div>

<!-- SELEÇÃO DE FASES -->
<div id="phaseMenu" class="panel">
  <h2>Selecionar Fase</h2>
  <div id="phaseGrid"></div>
  <button class="btn sec" id="btnVoltarFases">VOLTAR</button>
</div>

<!-- COLEÇÃO -->
<div id="colMenu" class="panel">
  <h2>Coleção de Gatinhos</h2>
  <p id="colCount">0 coletados</p>
  <div id="collectionGrid"></div>
  <button class="btn sec" id="btnVoltarCol">VOLTAR</button>
</div>

<div id="detail">
  <h3 id="dName"></h3>
  <canvas id="dSwatch" width="72" height="72"></canvas>
  <p id="dDesc"></p>
  <button class="btn sec" id="btnCloseDetail" style="min-width:100px;padding:6px 16px">Fechar</button>
</div>

<!-- FIM DE FASE -->
<div id="finishPanel">
  <h2>FASE CONCLUÍDA!</h2>
  <div class="stat">Gatinhos: <span id="fCats">0</span></div>
  <div class="stat">Tempo: <span id="fTime">0</span>s</div>
  <div class="stat">Melhor: <span id="fBest">—</span></div>
  <div style="margin-top:16px">
    <button class="btn" id="btnNext">PRÓXIMA FASE</button>
    <button class="btn sec" id="btnRetry">REPETIR</button>
    <button class="btn sec" id="btnMenuFinish">MENU</button>
  </div>
</div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=960,H=540;

const imgPlayer=new Image();
imgPlayer.src='img/player.png';

// ===== CATÁLOGO =====
const CAT_DATA=[
  {name:"Carvão",colors:["#1a1a1a","#333"],mix:0,desc:"Preto puro. Dorme 18h e ainda acorda cansado."},
  {name:"Neve",colors:["#f5f5f5","#ddd"],mix:0,desc:"Branco total. Miado tão baixo que parece suspiro."},
  {name:"Laranja",colors:["#e67e22","#d35400"],mix:0,desc:"Clássico. 50% mais chance de se perder em caixas."},
  {name:"Cinza",colors:["#7f8c8d","#95a5a6"],mix:0,desc:"Especialista em sumir no sofá da mesma cor."},
  {name:"Chocolate",colors:["#6d4c41","#4e342e"],mix:0,desc:"Odeia água, ama torneira pingando."},
  {name:"Creme",colors:["#f5e6c8","#e8d5a3"],mix:0,desc:"Derrete de preguiça no sol das 15h."},
  {name:"Tigrado",colors:["#e67e22","#2c3e50"],mix:1,desc:"Corre na velocidade da luz… até ver um laser."},
  {name:"Calico",colors:["#e74c3c","#f5f5f5","#2c3e50"],mix:1,desc:"Tricolor. Quase sempre rainha da casa."},
  {name:"Siamês",colors:["#f5e6c8","#4a3728"],mix:1,desc:"Conversador nato. Nunca cala a boca."},
  {name:"Fumaça",colors:["#bdc3c7","#2c3e50"],mix:1,desc:"Aparece e some como fantasma."},
  {name:"Dourado",colors:["#f1c40f","#e67e22"],mix:1,desc:"Acredita ser o sol personificado."},
  {name:"Azul-Russo",colors:["#5d6d7e","#85929e"],mix:0,desc:"Elegante e viciado em carinho na cabeça."},
  {name:"Rosa",colors:["#ff9ff3","#feca57"],mix:1,desc:"Existe só neste jogo… e no seu coração."},
  {name:"Menta",colors:["#1dd1a1","#10ac84"],mix:0,desc:"Adora plantas. Finge que não derrubou o vaso."},
  {name:"Céu",colors:["#54a0ff","#2e86de"],mix:0,desc:"Passa o dia julgando os pássaros."},
  {name:"Uva",colors:["#5f27cd","#341f97"],mix:0,desc:"Misterioso. Some às 3h da manhã."},
  {name:"Arco-Íris",colors:["#ff6b6b","#feca57","#1dd1a1","#54a0ff"],mix:1,desc:"Dá sorte e pelos em tudo."},
  {name:"Sombra",colors:["#2c3e50","#1a1a2e"],mix:1,desc:"Só é visto quando quer."},
  {name:"Pêssego",colors:["#ff9f43","#feca57"],mix:1,desc:"Derrete no colo em 4 segundos."},
  {name:"Prata",colors:["#dfe6e9","#b2bec3"],mix:0,desc:"Reflete a luz e a própria vaidade."}
];

// ===== ESTADO GLOBAL =====
let state='menu'; // menu|phases|playing|infinite|collection|finish
let currentPhase=0;
let collected=new Set(JSON.parse(localStorage.getItem('motoCats')||'[]'));
let bestTimes=JSON.parse(localStorage.getItem('motoBest')||'{}');
let phaseCatsGot=new Set();
let startTime=0;
let finishX=0;

const player={x:120,y:300,vx:0,vy:0,w:88,h:56,angle:0,grounded:false,onRamp:false,wheelie:false,boostTimer:0};
let camX=0,camY=0;

const GRAVITY=0.48,MAX_SPEED=9.8,ACCEL=0.32,FRICTION=0.94,WHEELIE_T=0.09,MAX_WH=1.15;

// ===== TIPOS DE SEGMENTO =====
// ground, rampUp, rampDown, platform, boost, tunnel, obstacle, finish

let level=[],cats=[],lastGenX=0,lastSegType='';

// ========== 10 FASES HAND-CRAFTED ==========
function makePhase(id){
  const L=[],C=[];
  let x=0;
  const g=(w,y=420)=>{L.push({type:'ground',x,y,w,h:140});x+=w};
  const ru=(w,h)=>{L.push({type:'rampUp',x,y:420,w,h});x+=w};
  const rd=(w,h,baseY=420)=>{L.push({type:'rampDown',x,y:baseY,w,h});x+=w};
  const pl=(w,y)=>{L.push({type:'platform',x,y,w,h:26});};
  const bo=(bx,by,bw=90)=>{L.push({type:'boost',x:bx,y:by,w:bw,h:18});};
  const ob=(ox,oy=408,ow=28,oh=18)=>{L.push({type:'obstacle',x:ox,y:oy,w:ow,h:oh});};
  const tu=(w,y=300)=>{L.push({type:'tunnel',x,y,w,h:160});x+=w};
  const cat=(cx,cy,tid)=>{C.push({x:cx,y:cy,w:36,h:36,typeId:tid%CAT_DATA.length,collected:false,bob:Math.random()*6});};

  if(id===1){ // APRENDIZADO
    g(500);ob(x-200);g(180);ru(140,90);g(300);ob(x-120);g(200);
    cat(x-350,380,0);cat(x-80,380,1);
    ru(160,100);bo(x-90,330); // pequeno salto
    g(350);cat(x-100,380,2);
    g(200);L.push({type:'finish',x,y:380,w:40,h:80});finishX=x+20;
  }
  else if(id===2){ // PRIMEIROS DESAFIOS
    g(400);ob(x-150);ob(x-80);g(220);
    ru(130,80);g(180);ob(x-90);g(150);
    cat(x-200,380,3);rd(120,80);g(250);
    ru(170,110);bo(x-100,320);g(280);
    cat(x-80,380,4);ob(x-200);ob(x-130);g(200);
    pl(160,340);cat(x-80,300,5);
    g(180);L.push({type:'finish',x,y:380,w:40,h:80});finishX=x+20;
  }
  else if(id===3){ // TÚNEL
    g(380);ob(x-100);g(160);ru(150,95);g(200);
    cat(x-60,380,6);tu(420,290);
    ob(x-300,388);ob(x-180,388);cat(x-100,360,7);
    g(280);ru(160,105);bo(x-95,325);g(300);
    cat(x-90,380,8);g(160);
    L.push({type:'finish',x,y:380,w:40,h:80});finishX=x+20;
  }
  else if(id===4){ // VELOCIDADE
    g(350);rd(160,70); // descida
    bo(x-40,400);g(180);ru(200,130);bo(x-110,300);
    g(320); // salto médio
    cat(x-200,380,9);ob(x-100);g(220);
    rd(140,60);bo(x-30,400);ru(180,120);g(280);
    cat(x-70,380,10);ob(x-180);ob(x-110);g(200);
    cat(x-50,380,11);g(150);
    L.push({type:'finish',x,y:380,w:40,h:80});finishX=x+20;
  }
  else if(id===5){ // ALTURA
    g(320);ru(180,140);pl(220,280);cat(x-100,240,12);
    rd(150,140);g(200);ob(x-80);g(160);
    ru(160,110);pl(180,310);cat(x-70,270,13);
    pl(140,250);cat(x-50,210,14);
    rd(130,110);g(250);ru(140,90);g(200);
    L.push({type:'finish',x,y:380,w:40,h:80});finishX=x+20;
  }
  else if(id===6){ // COMBINAÇÃO
    g(300);ob(x-120);ob(x-60);g(150);ru(150,100);g(180);
    tu(380,295);ob(x-250,385);cat(x-120,355,15);g(200);
    rd(130,50);bo(x-20,400);ru(190,125);g(260);
    cat(x-90,380,16);pl(160,330);cat(x-50,290,17);
    g(180);ob(x-100);g(160);
    L.push({type:'finish',x,y:380,w:40,h:80});finishX=x+20;
  }
  else if(id===7){ // FLORESTA (visual via obstacles)
    g(360);ob(x-180,405,32,22);ob(x-100,405,26,18);g(200);
    ru(150,95);g(160);cat(x-50,380,0);rd(120,70);
    g(220);ob(x-140,405,30,20);ob(x-70,405,28,18);g(180);
    ru(170,115);bo(x-100,315);g(280);cat(x-100,380,1);
    pl(150,340);cat(x-50,300,2);g(200);
    ob(x-90,405,34,22);g(160);
    L.push({type:'finish',x,y:380,w:40,h:80});finishX=x+20;
  }
  else if(id===8){ // INDUSTRIAL
    g(320);ob(x-130,400,36,24);g(160);tu(400,285);
    ob(x-280,380,30,20);ob(x-160,380,32,22);cat(x-80,350,3);
    g(220);ru(180,120);bo(x-105,310);g(300);
    cat(x-120,380,4);pl(170,320);cat(x-60,280,5);
    rd(140,100);g(200);ob(x-80,400,34,24);g(180);
    L.push({type:'finish',x,y:380,w:40,h:80});finishX=x+20;
  }
  else if(id===9){ // NOITE
    g(340);ob(x-150);g(180);ru(160,105);g(200);
    tu(450,290);ob(x-320,385);ob(x-200,385);cat(x-100,355,6);
    g(180);rd(140,55);bo(x-25,400);ru(200,135);g(300);
    cat(x-150,380,7);pl(160,300);cat(x-50,260,8);
    g(200);ob(x-100);ob(x-50);g(180);
    L.push({type:'finish',x,y:380,w:40,h:80});finishX=x+20;
  }
  else if(id===10){ // FINAL
    g(280);ob(x-140);ob(x-80);ob(x-30);g(160);
    ru(150,100);g(140);tu(360,290);ob(x-250,385);cat(x-100,350,9);
    g(180);rd(130,50);bo(x-20,400);ru(210,140);g(280);
    cat(x-120,380,10);pl(180,300);cat(x-70,260,11);pl(140,240);cat(x-40,200,12);
    rd(150,120);g(200);ob(x-110);ob(x-50);g(160);
    ru(170,115);bo(x-95,315);g(260);
    cat(x-80,380,13);g(180);
    L.push({type:'finish',x,y:380,w:40,h:80});finishX=x+20;
  }

  return {level:L,cats:C,finishX};
}

// ========== INFINITO ==========
function resetInfinite(){
  level=[];cats=[];lastGenX=0;lastSegType='';
  player.x=120;player.y=300;player.vx=0;player.vy=0;player.angle=0;player.boostTimer=0;
  camX=0;camY=0;phaseCatsGot=new Set();
  addSeg('ground',0,420,600);
  lastGenX=600;
  generateInfinite();
}

function addSeg(type,x,y,w,h,extra){
  const s={type,x,y,w,h:h||0};
  if(extra)Object.assign(s,extra);
  level.push(s);
  lastSegType=type;
  return s;
}

function generateInfinite(){
  while(lastGenX<camX+W+1100){
    const r=Math.random();
    let next='ground';
    // evita repetições
    const avoid=lastSegType;
    const choices=['ground','ground','rampUp','obstacle','obstacle','tunnel','platform','boostGap','descent'];
    do{next=choices[Math.floor(Math.random()*choices.length)];}while(next===avoid&&Math.random()<0.7);

    if(next==='ground'){
      const w=350+Math.random()*400;
      addSeg('ground',lastGenX,420,w,140);
      if(Math.random()>0.55){
        const ox=lastGenX+80+Math.random()*(w-160);
        addSeg('obstacle',ox,408,26+Math.random()*12,16+Math.random()*8);
      }
      lastGenX+=w;
    }
    else if(next==='rampUp'){
      const w=140+Math.random()*80,h=80+Math.random()*60;
      addSeg('rampUp',lastGenX,420,w,h);
      lastGenX+=w;
      if(Math.random()>0.4){
        const pw=120+Math.random()*100;
        addSeg('platform',lastGenX-20,420-h+10,pw,24);
      }
      const gw=280+Math.random()*200;
      addSeg('ground',lastGenX,420,gw,140);
      lastGenX+=gw;
    }
    else if(next==='obstacle'){
      const w=300+Math.random()*250;
      addSeg('ground',lastGenX,420,w,140);
      const n=1+Math.floor(Math.random()*3);
      for(let i=0;i<n;i++){
        addSeg('obstacle',lastGenX+60+i*70+Math.random()*30,408,24+Math.random()*14,15+Math.random()*10);
      }
      lastGenX+=w;
    }
    else if(next==='tunnel'){
      const w=320+Math.random()*200;
      addSeg('tunnel',lastGenX,290,w,160);
      if(Math.random()>0.5)addSeg('obstacle',lastGenX+w*0.4,388,28,18);
      lastGenX+=w;
      addSeg('ground',lastGenX,420,200,140);
      lastGenX+=200;
    }
    else if(next==='platform'){
      const w=280+Math.random()*180;
      addSeg('ground',lastGenX,420,w,140);
      addSeg('rampUp',lastGenX+40,420,130,100);
      addSeg('platform',lastGenX+170,320,140+Math.random()*80,24);
      lastGenX+=w;
    }
    else if(next==='boostGap'){
      const rw=170+Math.random()*70,rh=110+Math.random()*50;
      addSeg('rampUp',lastGenX,420,rw,rh);
      addSeg('boost',lastGenX+rw*0.5,420-rh+8,85,18);
      const gap=200+Math.random()*140;
      lastGenX+=rw+gap;
      const gw=320+Math.random()*200;
      addSeg('ground',lastGenX,420,gw,140);
      lastGenX+=gw;
    }
    else if(next==='descent'){
      const w=200+Math.random()*120;
      addSeg('rampDown',lastGenX,420,w,60+Math.random()*40);
      lastGenX+=w;
      addSeg('boost',lastGenX-30,400,80,18);
      const gw=300+Math.random()*250;
      addSeg('ground',lastGenX,420,gw,140);
      lastGenX+=gw;
    }

    // gato ocasional
    if(Math.random()>0.62){
      cats.push({x:lastGenX-150-Math.random()*200,y:370+Math.random()*20,w:36,h:36,
        typeId:Math.floor(Math.random()*CAT_DATA.length),collected:false,bob:Math.random()*6});
    }
  }
  // limpa atrás
  while(level.length&&level[0].x+(level[0].w||0)<camX-500)level.shift();
  while(cats.length&&cats[0].x<camX-300)cats.shift();
}

// ========== HELPERS ==========
function getSegY(seg,px){
  if(seg.type==='ground'||seg.type==='platform'||seg.type==='boost'||seg.type==='obstacle'||seg.type==='finish'||seg.type==='tunnel')return seg.y;
  if(seg.type==='rampUp'){const t=Math.max(0,Math.min(1,(px-seg.x)/seg.w));return seg.y-t*seg.h;}
  if(seg.type==='rampDown'){const t=Math.max(0,Math.min(1,(px-seg.x)/seg.w));return seg.y+t*seg.h;}
  return seg.y;
}
function getSlope(seg){
  if(seg.type==='rampUp')return -seg.h/seg.w;
  if(seg.type==='rampDown')return seg.h/seg.w;
  return 0;
}

// ========== INPUT ==========
const keys={};
window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code==='KeyM'||e.code==='Escape'){
    if(state==='playing'||state==='infinite')openMain();
  }
});
window.addEventListener('keyup',e=>keys[e.code]=false);

// menus
document.getElementById('btnJogar').onclick=()=>{state='phases';document.getElementById('mainMenu').classList.remove('open');document.getElementById('phaseMenu').classList.add('open');buildPhaseButtons();};
document.getElementById('btnInfinita').onclick=()=>{startInfinite();};
document.getElementById('btnColecao').onclick=()=>{state='collection';document.getElementById('mainMenu').classList.remove('open');document.getElementById('colMenu').classList.add('open');rebuildCol();};
document.getElementById('btnVoltarFases').onclick=openMain;
document.getElementById('btnVoltarCol').onclick=openMain;
document.getElementById('btnCloseDetail').onclick=()=>document.getElementById('detail').classList.remove('open');
document.getElementById('btnNext').onclick=()=>{if(currentPhase<10)startPhase(currentPhase+1);else openMain();};
document.getElementById('btnRetry').onclick=()=>{if(state==='finish'){document.getElementById('finishPanel').classList.remove('open');startPhase(currentPhase);}};
document.getElementById('btnMenuFinish').onclick=()=>{document.getElementById('finishPanel').classList.remove('open');openMain();};

function openMain(){
  state='menu';
  document.getElementById('mainMenu').classList.add('open');
  document.getElementById('phaseMenu').classList.remove('open');
  document.getElementById('colMenu').classList.remove('open');
  document.getElementById('finishPanel').classList.remove('open');
  document.getElementById('hud').style.display='none';
  document.getElementById('hint').style.display='none';
  document.getElementById('detail').classList.remove('open');
}

function buildPhaseButtons(){
  const g=document.getElementById('phaseGrid');g.innerHTML='';
  for(let i=1;i<=10;i++){
    const b=document.createElement('button');b.className='phaseBtn';b.textContent='FASE '+i;
    b.onclick=()=>startPhase(i);g.appendChild(b);
  }
}

function startPhase(id){
  currentPhase=id;
  const data=makePhase(id);
  level=data.level;cats=data.cats;finishX=data.finishX;
  player.x=120;player.y=300;player.vx=0;player.vy=0;player.angle=0;player.boostTimer=0;
  camX=0;camY=0;phaseCatsGot=new Set();startTime=performance.now();
  state='playing';
  document.getElementById('phaseMenu').classList.remove('open');
  document.getElementById('mainMenu').classList.remove('open');
  document.getElementById('finishPanel').classList.remove('open');
  document.getElementById('hud').style.display='block';
  document.getElementById('hint').style.display='block';
  document.getElementById('hudPhase').textContent='FASE '+id;
  document.getElementById('catsTotal').textContent=cats.length;
  document.getElementById('cats').textContent='0';
}

function startInfinite(){
  state='infinite';resetInfinite();startTime=performance.now();
  document.getElementById('mainMenu').classList.remove('open');
  document.getElementById('hud').style.display='block';
  document.getElementById('hint').style.display='block';
  document.getElementById('hudPhase').textContent='INFINITO';
  document.getElementById('catsTotal').textContent='∞';
}

// coleção
function rebuildCol(){
  const grid=document.getElementById('collectionGrid');grid.innerHTML='';
  CAT_DATA.forEach((d,i)=>{
    const got=collected.has(i);
    const card=document.createElement('div');card.className='catCard'+(got?' got':' locked');
    const cnv=document.createElement('canvas');cnv.width=40;cnv.height=40;
    const c=cnv.getContext('2d');c.imageSmoothingEnabled=false;
    if(got)drawCat(c,d,40);else{c.fillStyle='#333';c.fillRect(6,6,28,28);c.fillStyle='#555';c.font='16px monospace';c.fillText('?',15,26);}
    card.appendChild(cnv);
    const nm=document.createElement('div');nm.className='nm';nm.textContent=got?d.name:'???';card.appendChild(nm);
    if(got)card.onclick=()=>showDetail(i);
    grid.appendChild(card);
  });
  document.getElementById('colCount').textContent=collected.size+' / '+CAT_DATA.length;
}
function showDetail(id){
  const d=CAT_DATA[id];
  document.getElementById('dName').textContent=d.name;
  document.getElementById('dDesc').textContent=d.desc;
  const c=document.getElementById('dSwatch').getContext('2d');
  c.imageSmoothingEnabled=false;c.clearRect(0,0,72,72);drawCat(c,d,72);
  document.getElementById('detail').classList.add('open');
}
function drawCat(c,d,sz){
  const s=sz/16;
  c.fillStyle=d.colors[0];
  c.fillRect(3*s,7*s,10*s,7*s);c.fillRect(4*s,2*s,8*s,6*s);
  c.fillRect(3*s,0,3*s,4*s);c.fillRect(10*s,0,3*s,4*s);
  if(d.mix&&d.colors[1]){c.fillStyle=d.colors[1];c.fillRect(8*s,3*s,4*s,5*s);c.fillRect(5*s,9*s,5*s,4*s);}
  if(d.colors[2]){c.fillStyle=d.colors[2];c.fillRect(4*s,4*s,3*s,3*s);}
  if(d.colors[3]){c.fillStyle=d.colors[3];c.fillRect(9*s,10*s,3*s,3*s);}
  c.fillStyle='#222';c.fillRect(5*s,4*s,2*s,2*s);c.fillRect(9*s,4*s,2*s,2*s);
  c.fillStyle='#ff9ff3';c.fillRect(7*s,6*s,2*s,1*s);
}

// ========== UPDATE ==========
function update(){
  if(state!=='playing'&&state!=='infinite')return;

  if(keys['KeyD']||keys['ArrowRight'])player.vx+=ACCEL;
  if(keys['KeyA']||keys['ArrowLeft'])player.vx-=ACCEL*0.7;
  player.vx=Math.max(-MAX_SPEED*0.5,Math.min(MAX_SPEED,player.vx));
  if(player.grounded)player.vx*=FRICTION;else player.vx*=0.997;

  if(keys['KeyW']||keys['ArrowUp']){
    if(player.grounded||player.onRamp){player.angle-=WHEELIE_T;player.wheelie=true;}
  }else{
    player.wheelie=false;
    if(player.grounded||player.onRamp)player.angle*=0.88;
    else player.angle*=0.97;
  }
  player.angle=Math.max(-MAX_WH,Math.min(0.12,player.angle));

  if(player.boostTimer>0){player.boostTimer--;player.vx=Math.min(player.vx+0.48,MAX_SPEED+4.5);}

  player.vy+=GRAVITY;if(player.vy>16)player.vy=16;
  player.x+=player.vx;player.y+=player.vy;

  // colisão
  player.grounded=false;player.onRamp=false;
  const fx=player.x+player.w*0.4,fy=player.y+player.h;
  let bestY=null,best=null;

  for(const seg of level){
    if(seg.type==='obstacle'){
      // colisão só se NÃO estiver empinando o suficiente
      const wheelieEnough=player.angle<-0.45;
      if(!wheelieEnough){
        if(fx>seg.x-5&&fx<seg.x+seg.w+5&&fy>seg.y-8&&player.y+player.h*0.5<seg.y+seg.h+10){
          // empurra de volta / para
          player.vx*=0.3;player.x=seg.x-player.w*0.45;
        }
      }
      continue;
    }
    if(seg.type==='finish'&&state==='playing'){
      if(player.x+player.w*0.5>seg.x){endPhase();return;}
      continue;
    }
    if(fx<seg.x-10||fx>seg.x+(seg.w||0)+10)continue;
    const sy=getSegY(seg,fx);
    if(fy>=sy-12&&player.y+player.h*0.3<sy+40){
      if(bestY===null||sy<bestY){bestY=sy;best=seg;}
    }
  }

  if(best&&bestY!==null){
    if(player.vy>=-2||fy>=bestY-5){
      player.y=bestY-player.h;player.vy=0;player.grounded=true;
      if(best.type==='boost'){
        if(player.boostTimer<=0){player.boostTimer=28;player.vy=-6.8;player.grounded=false;}
      }else if(best.type==='rampUp'||best.type==='rampDown'){
        player.onRamp=true;
        const ra=Math.atan(getSlope(best));
        if(!player.wheelie)player.angle=player.angle*0.5+ra*0.5;
      }else if(!player.wheelie)player.angle*=0.78;
    }
  }

  // gatos
  for(const cat of cats){
    if(cat.collected)continue;
    const cx=cat.x+18,cy=cat.y+18+Math.sin(Date.now()/200+cat.bob)*5;
    if(Math.abs(player.x+44-cx)<40&&Math.abs(player.y+28-cy)<40){
      cat.collected=true;
      collected.add(cat.typeId);
      phaseCatsGot.add(cat.typeId);
      localStorage.setItem('motoCats',JSON.stringify([...collected]));
      document.getElementById('cats').textContent=phaseCatsGot.size;
    }
  }

  if(player.y>H+250){
    if(state==='infinite'){player.x=Math.max(120,player.x-350);player.y=300;player.vx=0;player.vy=0;player.angle=0;player.boostTimer=0;}
    else{ // respawn início da fase
      player.x=120;player.y=300;player.vx=0;player.vy=0;player.angle=0;player.boostTimer=0;camX=0;camY=0;
    }
  }

  // câmera suave X + Y
  const tCamX=player.x-W*0.28;
  camX+=(tCamX-camX)*0.11;if(camX<0)camX=0;
  const tCamY=player.y-H*0.55;
  camY+=(tCamY-camY)*0.08;
  if(camY>0)camY=0;if(camY<-120)camY=-120;

  if(state==='infinite')generateInfinite();

  const dist=Math.max(0,Math.floor((player.x-120)/10));
  document.getElementById('dist').textContent=dist;
  document.getElementById('timer').textContent=((performance.now()-startTime)/1000).toFixed(1);
  if(state==='infinite')document.getElementById('cats').textContent=collected.size;
}

function endPhase(){
  state='finish';
  const t=((performance.now()-startTime)/1000).toFixed(1);
  const key='p'+currentPhase;
  let best=bestTimes[key];
  if(!best||parseFloat(t)<parseFloat(best)){best=t;bestTimes[key]=t;localStorage.setItem('motoBest',JSON.stringify(bestTimes));}
  document.getElementById('fCats').textContent=phaseCatsGot.size+' / '+cats.length;
  document.getElementById('fTime').textContent=t;
  document.getElementById('fBest').textContent=best+'s';
  document.getElementById('finishPanel').classList.add('open');
  document.getElementById('btnNext').style.display=currentPhase<10?'inline-block':'none';
}

// ========== DRAW ==========
function drawBg(){
  const night=currentPhase===9||(state==='infinite'&&Math.floor(camX/3000)%3===2);
  const g=ctx.createLinearGradient(0,0,0,H);
  if(night){g.addColorStop(0,'#0a0a18');g.addColorStop(1,'#12122a');}
  else{g.addColorStop(0,'#0f0c29');g.addColorStop(0.5,'#302b63');g.addColorStop(1,'#24243e');}
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for(let i=0;i<40;i++){
    const sx=((i*157+camX*0.07)%(W+20))-10;
    const sy=(i*89)%(H*0.42)+camY*0.3;
    ctx.globalAlpha=0.2+(i%3)*0.2;ctx.fillRect(sx,sy,2,2);
  }
  ctx.globalAlpha=1;
}

function drawSeg(seg){
  const sx=seg.x-camX,sy=seg.y-camY;
  if(sx+(seg.w||0)<-30||sx>W+30)return;

  if(seg.type==='ground'){
    ctx.fillStyle='#2d3436';ctx.fillRect(sx,sy,seg.w,seg.h);
    ctx.fillStyle='#00b894';ctx.fillRect(sx,sy-4,seg.w,5);
    ctx.fillStyle='#636e72';ctx.fillRect(sx,sy,seg.w,4);
  }
  else if(seg.type==='platform'){
    ctx.fillStyle='#6c5ce7';ctx.fillRect(sx,sy,seg.w,seg.h);
    ctx.fillStyle='#a29bfe';ctx.fillRect(sx,sy,seg.w,4);
  }
  else if(seg.type==='rampUp'){
    ctx.beginPath();ctx.moveTo(sx,sy+5);ctx.lineTo(sx+seg.w,sy-seg.h+5);ctx.lineTo(sx+seg.w,sy+90);ctx.lineTo(sx,sy+90);ctx.closePath();
    ctx.fillStyle='#2d3436';ctx.fill();
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+seg.w,sy-seg.h);ctx.lineTo(sx+seg.w,sy-seg.h+6);ctx.lineTo(sx,sy+6);ctx.closePath();
    ctx.fillStyle='#00b894';ctx.fill();
  }
  else if(seg.type==='rampDown'){
    ctx.beginPath();ctx.moveTo(sx,sy+5);ctx.lineTo(sx+seg.w,sy+seg.h+5);ctx.lineTo(sx+seg.w,sy+seg.h+90);ctx.lineTo(sx,sy+90);ctx.closePath();
    ctx.fillStyle='#2d3436';ctx.fill();
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+seg.w,sy+seg.h);ctx.lineTo(sx+seg.w,sy+seg.h+6);ctx.lineTo(sx,sy+6);ctx.closePath();
    ctx.fillStyle='#00b894';ctx.fill();
  }
  else if(seg.type==='boost'){
    const p=0.5+Math.sin(Date.now()/100)*0.5;
    ctx.fillStyle=`rgba(255,190,0,${p})`;ctx.fillRect(sx,sy,seg.w,seg.h);
    ctx.fillStyle='#ff9f1a';ctx.fillRect(sx+2,sy+2,seg.w-4,seg.h-4);
    ctx.fillStyle='#fff';ctx.font='bold 10px Courier New';ctx.fillText('BOOST',sx+6,sy+13);
  }
  else if(seg.type==='obstacle'){
    ctx.fillStyle='#8B4513';ctx.fillRect(sx,sy,seg.w,seg.h);
    ctx.fillStyle='#A0522D';ctx.fillRect(sx+3,sy+3,seg.w-6,seg.h-6);
  }
  else if(seg.type==='tunnel'){
    ctx.fillStyle='#1a1a1a';ctx.fillRect(sx,sy-20,seg.w,seg.h+40);
    ctx.fillStyle='#111';ctx.fillRect(sx,sy,seg.w,8);ctx.fillRect(sx,sy+seg.h-8,seg.w,8);
    // luzes
    ctx.fillStyle='#f1c40f';
    for(let i=30;i<seg.w;i+=70)ctx.fillRect(sx+i,sy+12,8,6);
  }
  else if(seg.type==='finish'){
    ctx.fillStyle='#fff';ctx.fillRect(sx,sy,12,seg.h);
    ctx.fillStyle='#e74c3c';
    for(let i=0;i<seg.h;i+=16)ctx.fillRect(sx,sy+i,12,8);
    ctx.fillStyle='#00ff88';ctx.font='bold 12px Courier New';ctx.fillText('CHEGADA',sx-10,sy-8);
  }
}

function drawCats(){
  for(const cat of cats){
    if(cat.collected)continue;
    const sx=cat.x-camX,sy=cat.y-camY+Math.sin(Date.now()/220+cat.bob)*5;
    if(sx<-40||sx>W+40)continue;
    drawCat(ctx,CAT_DATA[cat.typeId],36,sx,sy);
  }
}
function drawCat(c,d,sz,ox=0,oy=0){
  const s=sz/16;
  c.fillStyle=d.colors[0];
  c.fillRect(ox+3*s,oy+7*s,10*s,7*s);c.fillRect(ox+4*s,oy+2*s,8*s,6*s);
  c.fillRect(ox+3*s,oy,3*s,4*s);c.fillRect(ox+10*s,oy,3*s,4*s);
  if(d.mix&&d.colors[1]){c.fillStyle=d.colors[1];c.fillRect(ox+8*s,oy+3*s,4*s,5*s);c.fillRect(ox+5*s,oy+9*s,5*s,4*s);}
  if(d.colors[2]){c.fillStyle=d.colors[2];c.fillRect(ox+4*s,oy+4*s,3*s,3*s);}
  c.fillStyle='#222';c.fillRect(ox+5*s,oy+4*s,2*s,2*s);c.fillRect(ox+9*s,oy+4*s,2*s,2*s);
  c.fillStyle='#ff9ff3';c.fillRect(ox+7*s,oy+6*s,2*s,1*s);
}

function drawPlayer(){
  const px=player.x-camX,py=player.y-camY;
  ctx.save();ctx.translate(px+player.w*0.38,py+player.h*0.72);ctx.rotate(player.angle);
  if(imgPlayer.complete&&imgPlayer.naturalWidth>0){
    ctx.drawImage(imgPlayer,-player.w*0.38,-player.h*0.72,player.w,player.h);
  }else{
    ctx.fillStyle='#111';ctx.fillRect(-28,-8,22,22);ctx.fillStyle='#555';ctx.fillRect(-22,-2,11,11);
    ctx.fillStyle='#111';ctx.fillRect(22,-8,20,20);ctx.fillStyle='#555';ctx.fillRect(27,-2,11,11);
    ctx.fillStyle='#c0392b';ctx.fillRect(-16,-18,48,15);
    ctx.fillStyle='#e74c3c';ctx.fillRect(-4,-28,28,13);
    ctx.fillStyle='#2c3e50';ctx.fillRect(22,-36,5,20);ctx.fillRect(16,-38,16,5);
    ctx.fillStyle='#3498db';ctx.fillRect(0,-42,15,18);
    ctx.fillStyle='#f1c40f';ctx.fillRect(1,-54,13,13);
    ctx.fillStyle='#2c3e50';ctx.fillRect(3,-50,8,4);
    ctx.fillStyle='#3498db';ctx.fillRect(12,-36,13,6);
  }
  ctx.restore();
  if(player.boostTimer>0){ctx.fillStyle='rgba(255,180,0,.9)';ctx.font='bold 12px Courier New';ctx.fillText('BOOST!',px,py-14);}
  if(player.wheelie){ctx.fillStyle='#0f8';ctx.font='11px Courier New';ctx.fillText('WHEELIE',px-4,py-28);}
}

function draw(){
  drawBg();
  if(state==='playing'||state==='infinite'){
    for(const s of level)drawSeg(s);
    drawCats();drawPlayer();
  }
}

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
